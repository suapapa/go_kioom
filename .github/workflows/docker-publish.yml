name: Publish kioom-mcp Docker Image

on:
  push:
    branches: [ "main" ]
    # SemVer 버전 태그가 푸시될 때 트리거 (예: v1.0.0)
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # github.repository 값은 <owner>/<repo> 형식입니다 (예: suapapa/go_kioom)
  IMAGE_NAME: ${{ github.repository }}/kioom-mcp
  # Node.js 20 deprecation 대응: JavaScript 액션이 Node.js 24 환경에서 실행되도록 강제
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # cosign 등을 사용하여 이미지 서명을 원할 경우 id-token 권한이 필요할 수 있습니다.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 멀티 아키텍처 빌드를 위한 QEMU 에뮬레이터 설정
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # Docker Buildx 설정 (멀티 아키텍처 빌드 및 캐싱 지원)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GitHub Container Registry 로그인
      # pull request 단계가 아닐 때만 로그인합니다.
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker 메타데이터 추출 (태그 및 라벨 구성)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 태그 매칭 룰 정의:
          # - main 브랜치 푸시 시: latest 태그 부여
          # - v*.*.* 태그 푸시 시: v1.2.3, v1.2, v1 형식을 자동으로 생성
          # - PR 시: pr-<pr_number>
          # - 그 외: Git Short SHA
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short

      # 다중 아키텍처 이미지 빌드 및 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: cmd/kioom-mcp/Dockerfile
          # amd64 및 arm64 멀티 아키텍처 지정
          platforms: linux/amd64,linux/arm64
          # PR이 아닐 때만 실제로 레지스트리에 푸시합니다.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 빌드 시간 단축을 위해 GHA(GitHub Actions) 내장 캐시 사용
          cache-from: type=gha
          cache-to: type=gha,mode=max
